name: Build and publish OpenWrt packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    if: github.event.created && !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86-64
          - aarch64_generic
          - aarch64_cortex-a53
          - aarch64_cortex-a72
          - arm_cortex-a7_neon-vfpv4
          - arm_cortex-a9_vfpv3-d16
          - arm_cortex-a15_neon-vfpv4
          - mips_24kc
          - mipsel_24kc
    steps:
      - uses: actions/checkout@v4
      - name: Use the tag commit timestamp for LuCI package versions
        run: printf 'SIM_RELAY_RELEASE_EPOCH=%s\n' "$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Build and verify SDK packages
        env:
          ARCH: ${{ matrix.target }}
          SDK_VERSION: '24.10.4'
          WITH_ZH_CN: '1'
          WITH_MM_PIN: '1'
        run: bash scripts/build-sdk.sh
      - name: Stage target-specific release assets
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          shopt -s nullglob
          builds=(.sdk-artifacts/*-"$TARGET"-*)
          if (( ${#builds[@]} != 1 )); then
            printf 'Expected one SDK output for %s, found %s\n' "$TARGET" "${#builds[@]}" >&2
            exit 1
          fi
          python3 scripts/prepare-release.py --target "$TARGET" --source "${builds[0]}" --output release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ matrix.target }}
          path: release-assets/*.ipk
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: openwrt-*
          merge-multiple: true
          path: release-assets
      - name: Verify artifacts and generate checksums
        shell: bash
        run: |
          shopt -s nullglob
          packages=(release-assets/*.ipk)
          if (( ${#packages[@]} != 36 )); then
            printf 'Expected 36 packages, found %s\n' "${#packages[@]}" >&2
            exit 1
          fi
          cd release-assets
          sha256sum -- *.ipk > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release-assets/*.ipk release-assets/SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false
